name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
        shell: pwsh
      - name: Run tests
        run: python -m pytest tests -q
        shell: pwsh
      - name: Smoke-test packaged executable
        run: |
          $exe = (Resolve-Path "dist\\Blind_log.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-smoke-test" -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          while (!$process.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
            $process.Refresh()
          }
          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Error "Packaged executable did not finish its startup smoke test within 45 seconds."
            exit 1
          }
          if ($process.ExitCode -ne 0) {
            Write-Error "Packaged executable smoke test failed with exit code $($process.ExitCode)."
            exit 1
          }
          Write-Host "Packaged executable loaded Python and imported application modules successfully."
        shell: pwsh

      - name: Build executable
        run: |
          python -m PyInstaller Blind_log.spec
          if (!(Test-Path "dist\Blind_log.exe")) {
            Write-Error "Blind_log.exe was not created"
            exit 1
          }
        shell: pwsh
