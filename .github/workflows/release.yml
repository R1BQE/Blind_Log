name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Резервный ручной запуск на случай, если автоматический триггер
  # по тегу не сработает (известная нестабильность GitHub Actions с
  # push-событиями на теги, особенно при многократном пересоздании
  # одного и того же тега). Запустить можно командой:
  #   gh workflow run release.yml -f version=3.4.6
  # или через вкладку Actions -> Build and Release -> Run workflow.
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для сборки (X.Y.Z), без буквы v. Должен существовать тег vX.Y.Z."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
        shell: pwsh

      - name: 🔍 Extract version from version.txt
        id: get_version
        run: |
          $content = Get-Content version.txt | Where-Object { $_ -match "FileVersion" }

          if ($content -match '([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $matches[1]
            echo "version=$version" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Error "❌ Не удалось извлечь версию из version.txt"
            exit 1
          }
        shell: pwsh


      - name: 🌐 Generate English changelog for release
        env:
          LIBRETRANSLATE_URLS: "https://translate.argosopentech.com/translate,https://translate.api.skitzen.com/translate,https://libretranslate.de/translate,https://trans.zillyhuhn.com/translate,https://translate.mentality.rip/translate,https://libretranslate.pussthecat.org/translate,https://libretranslate.esmailelbob.xyz/translate"
        run: |
          @'
import os
from pathlib import Path

import requests


urls = [
    u.strip()
    for u in os.environ.get("LIBRETRANSLATE_URLS", "").split(",")
    if u.strip()
]

path = Path("changeLog.txt")

if not path.exists():
    raise SystemExit(0)


def parse_sections(text):
    sections = {}
    current = None
    lines = []

    for line in text.splitlines():

        marker = line.strip().upper()

        if marker in ("[EN]", "[RU]"):

            if current:
                sections[current] = "\n".join(lines).strip()

            current = marker[1:-1]
            lines = []

        elif current:
            lines.append(line)

    if current:
        sections[current] = "\n".join(lines).strip()

    return sections



def translate_via(url, text):
    """Try a single LibreTranslate-compatible endpoint.

    Returns translated text on success, or None if this endpoint
    could not be used (down, wrong format, error, etc.) so the
    caller can move on to the next mirror.
    """

    try:
        response = requests.post(
            url,
            json={
                "q": text,
                "source": "ru",
                "target": "en",
                "format": "text"
            },
            headers={"Accept": "application/json"},
            timeout=15
        )
    except Exception as exc:
        print(f"  [skip] {url}: request failed ({exc})")
        return None

    if not response.ok:
        print(f"  [skip] {url}: HTTP {response.status_code}")
        return None

    try:
        data = response.json()
    except Exception:
        print(f"  [skip] {url}: response is not valid JSON")
        return None

    if not isinstance(data, dict):
        print(f"  [skip] {url}: unexpected response format")
        return None

    translated = data.get("translatedText", "")

    if not isinstance(translated, str) or not translated.strip():
        print(f"  [skip] {url}: no translatedText in response")
        return None

    return translated.strip()



def translate(text):

    if not text.strip():
        return ""

    for url in urls:
        print(f"Trying translation mirror: {url}")
        result = translate_via(url, text)

        if result:
            print(f"  [ok] translated via {url}")
            return result

    print("All translation mirrors failed, falling back to Russian text")
    return ""



content = path.read_text(
    encoding="utf-8"
)


parts = content.split("---", 1)

first = parts[0]
rest = parts[1] if len(parts) > 1 else ""


sections = parse_sections(first)

ru = sections.get("RU", "")
en = sections.get("EN", "")


if ru and not en:

    translated = translate(ru)

    # If every mirror failed, fall back to the Russian text itself
    # rather than leaving the [EN] section empty, so the release
    # description is never blank.
    if not translated:
        translated = ru

    new_content = (
        "[EN]\n"
        + translated
        + "\n\n[RU]\n"
        + ru
        + "\n"
    )

    if rest:
        new_content += "\n---" + rest

    path.write_text(
        new_content,
        encoding="utf-8"
    )

