name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Резервный ручной запуск на случай, если автоматический триггер
  # по тегу не сработает (известная нестабильность GitHub Actions с
  # push-событиями на теги, особенно при многократном пересоздании
  # одного и того же тега). Запустить можно командой:
  #   gh workflow run release.yml -f version=3.4.6
  # или через вкладку Actions -> Build and Release -> Run workflow.
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для сборки (X.Y.Z), без буквы v. Должен существовать тег vX.Y.Z."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip install argostranslate
        shell: pwsh

      - name: 🔍 Extract version from version.txt
        id: get_version
        run: |
          $content = Get-Content version.txt | Where-Object { $_ -match "FileVersion" }

          if ($content -match '([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $matches[1]
            echo "version=$version" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Error "❌ Не удалось извлечь версию из version.txt"
            exit 1
          }
        shell: pwsh


      - name: 🌍 Install Argos Translate ru→en language package
        run: python scripts/install_argos_package.py
        shell: pwsh


      - name: 🌐 Generate English changelog for release
        run: python scripts/translate_changelog.py
        shell: pwsh



      - name: 💾 Commit translated changeLog.txt back to repository
        run: python scripts/commit_changelog.py
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: 📜 Extract changelog from changeLog.txt
        id: changelog_file
        run: |
          if (Test-Path changeLog.txt) {

            python scripts/extract_changelog.py


            # Get-Content -Raw returns $null for an empty file, and
            # calling .TrimEnd() on $null crashes the step. Guard
            # against that explicitly. Note: PowerShell's -or does
            # not short-circuit, so the null check must be a
            # separate, nested condition rather than combined with
            # -or on the same line.
            $raw = Get-Content changelog_release.txt -Raw -Encoding utf8

            if ($null -eq $raw) {
              $desc = "Release v${{ steps.get_version.outputs.version }}"
            }
            elseif ($raw.Trim().Length -eq 0) {
              $desc = "Release v${{ steps.get_version.outputs.version }}"
            }
            else {
              $desc = $raw.TrimEnd("`r","`n")
            }

          }
          else {

            $desc = "Release v${{ steps.get_version.outputs.version }}"

          }


          $eof = [System.Guid]::NewGuid().ToString()

          echo "changelog<<$eof" >> $env:GITHUB_OUTPUT
          echo "$desc" >> $env:GITHUB_OUTPUT
          echo "$eof" >> $env:GITHUB_OUTPUT

        shell: pwsh


      - name: 🏗️ Build Blind_log.exe with PyInstaller
        run: |
          python -m PyInstaller Blind_log.spec

          if (!(Test-Path "dist\Blind_log.exe")) {
            Write-Error "❌ Файл не найден: dist\Blind_log.exe"
            exit 1
          }

        shell: pwsh


      - name: 📦 Archive build artifacts
        run: |
          Compress-Archive `
            -Path dist\Blind_log.exe `
            -DestinationPath dist\Blind_log.zip `
            -Force

        shell: pwsh


      - name: 🚀 Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2.3.2

        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Blind Log v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog_file.outputs.changelog }}
          files: dist/Blind_log.zip
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}