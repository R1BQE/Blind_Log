      - name: 📜 Extract changelog from changeLog.txt
        id: changelog_file
        run: |
          if (Test-Path changeLog.txt) {

            @'
from pathlib import Path

content = Path(
    "changeLog.txt"
).read_text(
    encoding="utf-8"
)

first_block = content.split(
    "---",
    1
)[0]


def extract(marker_start, marker_end):
    lines = []
    capture = False

    for line in first_block.splitlines():

        marker = line.strip().upper()

        if marker == marker_start:
            capture = True
            continue

        if marker_end and marker == marker_end:
            break

        if capture:
            lines.append(line)

    return "\n".join(lines).strip()


# Prefer the English section; if it is missing or empty
# (e.g. translation failed and there was no Russian text to
# fall back on either), use the Russian section instead so the
# release description is never blank.
text = extract("[EN]", "[RU]")

if not text:
    text = extract("[RU]", None)

print(text)

'@ | python > changelog_release.txt


            # Get-Content -Raw returns $null for an empty file, and
            # calling .TrimEnd() on $null crashes the step. Guard
            # against that explicitly. Note: PowerShell's -or does
            # not short-circuit, so the null check must be a
            # separate, nested condition rather than combined with
            # -or on the same line.
            $raw = Get-Content changelog_release.txt -Raw -Encoding utf8

            if ($null -eq $raw) {
              $desc = "Release v${{ steps.get_version.outputs.version }}"
            }
            elseif ($raw.Trim().Length -eq 0) {
              $desc = "Release v${{ steps.get_version.outputs.version }}"
            }
            else {
              $desc = $raw.TrimEnd("`r","`n")
            }

          }
          else {

            $desc = "Release v${{ steps.get_version.outputs.version }}"

          }


          $eof = [System.Guid]::NewGuid().ToString()

          echo "changelog<<$eof" >> $env:GITHUB_OUTPUT
          echo "$desc" >> $env:GITHUB_OUTPUT
          echo "$eof" >> $env:GITHUB_OUTPUT

        shell: pwsh


      - name: 🏗️ Build Blind_log.exe with PyInstaller
        run: |
          python -m PyInstaller Blind_log.spec

          if (!(Test-Path "dist\Blind_log.exe")) {
            Write-Error "❌ Файл не найден: dist\Blind_log.exe"
            exit 1
          }

        shell: pwsh


      - name: 📦 Archive build artifacts
        run: |
          Compress-Archive `
            -Path dist\Blind_log.exe `
            -DestinationPath dist\Blind_log.zip `
            -Force

        shell: pwsh


      - name: 🚀 Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2.3.2

        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Blind Log v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog_file.outputs.changelog }}
          files: dist/Blind_log.zip
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}