name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Ручной запуск: в Actions -> Build and Release -> Run workflow.
  # Формочка спрашивает версию (X.Y.Z), workflow сам создаёт тег vX.Y.Z,
  # переписывает version.txt, собирает exe и публикует релиз.
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (X.Y.Z, без буквы v). Workflow создаст тег vX.Y.Z."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
        shell: pwsh

      # Версия берётся из тега (push v*) или из поля формы (workflow_dispatch).
      # Проверяем формат X.Y.Z, чтобы кривой ввод не ушёл дальше.
      - name: 🔍 Determine version
        id: get_version
        run: |
          $raw = "${{ inputs.version }}"
          if ([string]::IsNullOrEmpty($raw)) {
            $raw = "${{ github.ref_name }}"
          }
          $version = $raw.Trim() -replace '^[vV]', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Некорректная версия: $version. Ожидается формат X.Y.Z."
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # Переписываем в version.txt только цифры версии (до сборки exe —
      # PyInstaller берёт метаданные именно оттуда). Остальные поля,
      # включая FileDescription, не трогаются.
      - name: 🔖 Set version in version.txt
        run: python update_version.py ${{ steps.get_version.outputs.version }}
        shell: pwsh

      - name: 📜 Extract changelog from changelog-en.txt
        id: changelog_file
        run: |
          if (Test-Path changelog-en.txt) {

            python scripts/extract_changelog.py

            # Get-Content -Raw returns $null for an empty file, and
            # calling .TrimEnd() on $null crashes the step. Guard
            # against that explicitly. Note: PowerShell's -or does
            # not short-circuit, so the null check must be a
            # separate, nested condition rather than combined with
            # -or on the same line.
            $raw = Get-Content changelog_release.txt -Raw -Encoding utf8

            if ($null -eq $raw) {
              $desc = "Release v${{ steps.get_version.outputs.version }}"
            }
            elseif ($raw.Trim().Length -eq 0) {
              $desc = "Release v${{ steps.get_version.outputs.version }}"
            }
            else {
              $desc = $raw.TrimEnd("`r","`n")
            }

          }
          else {

            $desc = "Release v${{ steps.get_version.outputs.version }}"

          }

          $eof = [System.Guid]::NewGuid().ToString()

          echo "changelog<<$eof" >> $env:GITHUB_OUTPUT
          echo "$desc" >> $env:GITHUB_OUTPUT
          echo "$eof" >> $env:GITHUB_OUTPUT

        shell: pwsh


      - name: 🏗️ Build Blind_log.exe with PyInstaller
        run: |
          python -m PyInstaller Blind_log.spec

          if (!(Test-Path "dist\Blind_log.exe")) {
            Write-Error "❌ Файл не найден: dist\Blind_log.exe"
            exit 1
          }

        shell: pwsh


      - name: 📦 Archive build artifacts
        run: |
          Compress-Archive `
            -Path dist\Blind_log.exe `
            -DestinationPath dist\Blind_log.zip `
            -Force

        shell: pwsh


      # Тег vX.Y.Z создаётся здесь же: при ручном запуске его ещё нет, и
      # GitHub API создаёт тег вместе с релизом (push-события при этом не
      # триггерятся, повторного запуска не будет).
      - name: 🚀 Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2.3.2

        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Blind Log v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog_file.outputs.changelog }}
          files: dist/Blind_log.zip
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
